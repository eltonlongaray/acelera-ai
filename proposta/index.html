<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua Proposta · Acelera Aí</title>
<meta name="description" content="As opções que montamos sob medida pro seu negócio.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1411">
<meta property="og:title" content="Sua proposta sob medida · Acelera Aí">
<meta property="og:description" content="As opções que montamos pro seu negócio.">
<meta property="og:image" content="https://eltonlongaray.github.io/acelera-ai/img/previa.jpg?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════
   BLOCO 1: IDENTIDADE
   ═══════════════════════════════════════════════════════════════ */
:root{ --tinta:#0A1411; --tinta-2:#111E1A; --verde:#128C4A; --verde-vivo:#25D366; --gelo:#F5F7F6; --branco:#fff; --texto:#0F1A16;
  --cinza:#5B6762; --cinza-claro:#A9B8B2; --linha:#E3E9E6; --linha-esc:rgba(255,255,255,.09); --amarelo:#FFC814; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--gelo);color:var(--texto);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.topo{background:var(--tinta);border-bottom:1px solid var(--linha-esc)}
.topo .in{max-width:64rem;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.03em;color:#fff;font-size:1rem;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--verde-vivo);display:grid;place-items:center}
.logo i svg{width:18px;height:18px}
.heroi{background:var(--tinta);color:#fff;padding:28px 20px 40px}
.heroi .in,.wrap{max-width:64rem;margin:0 auto}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--verde-vivo)}
h1{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.2;letter-spacing:-.025em;font-weight:800;margin:.5rem 0 .8rem;text-wrap:balance}
h1 em{font-style:normal;color:var(--verde-vivo)}
.heroi p{color:var(--cinza-claro);max-width:38rem}
.wrap{padding:28px 20px 48px}

/* ═══════════════════════════════════════════════════════════════
   BLOCO 2: OPÇÕES
   ═══════════════════════════════════════════════════════════════ */
.opcoes{display:grid;gap:16px;margin-top:-56px}
@media (min-width:860px){.opcoes{grid-template-columns:repeat(3,1fr);align-items:start}}
.op{background:var(--branco);border:1.5px solid var(--linha);border-radius:20px;padding:22px 20px;position:relative;box-shadow:0 10px 30px rgba(10,20,17,.06)}
.op.rec{border-color:var(--verde-vivo);box-shadow:0 14px 40px rgba(37,211,102,.18)}
.selo{position:absolute;top:-12px;left:20px;background:var(--verde-vivo);color:#06231A;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .7rem;border-radius:999px}
.op h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.2rem}
.op .dur{color:var(--cinza);font-size:.9rem;margin-bottom:.8rem}
.canais{list-style:none;margin-bottom:1rem}
.canais li{font-size:.93rem;padding:.15rem 0}
.canais li::before{content:"✓ ";color:var(--verde);font-weight:800}
.linha{display:flex;justify-content:space-between;gap:.8rem;font-size:.9rem;padding:.25rem 0;color:var(--cinza)}
.linha b{color:var(--texto);font-variant-numeric:tabular-nums;white-space:nowrap}
.linha small{display:block;font-size:.75rem;color:var(--cinza-claro)}
.tot{border-top:1px solid var(--linha);margin-top:.4rem;padding-top:.6rem;font-size:1.05rem;color:var(--texto);font-weight:700}
.tot b{font-size:1.35rem}
.est{background:#F0F8F3;border-radius:12px;padding:.7rem .8rem;margin:1rem 0;font-size:.9rem}
.est b{color:var(--verde)}
.btn{display:block;text-align:center;border:none;cursor:pointer;background:var(--verde-vivo);color:#06231A;font-weight:800;font-size:1.02rem;padding:.95rem 1.2rem;border-radius:999px;text-decoration:none;font-family:inherit}
.op:not(.rec) .btn{background:var(--tinta);color:#fff}
.notas{margin-top:28px;display:grid;gap:12px}
@media (min-width:760px){.notas{grid-template-columns:repeat(3,1fr)}}
.nota{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:16px;font-size:.88rem;color:var(--cinza)}
.nota h3{font-size:.95rem;color:var(--texto);margin-bottom:.3rem;font-weight:800}
.rodape{text-align:center;color:var(--cinza-claro);font-size:.78rem;padding:20px}
.vazio{max-width:30rem;margin:4rem auto;text-align:center;padding:0 20px}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <span class="logo"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#06231A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg></i>ACELERA AÍ</span>
</div></header>
<div id="app"></div>
<p class="rodape">Acelera Aí · Página desenvolvida por Elton Longaray</p>

<script>
// ═══════════════════════════════════════════════════════════════
// BLOCO 3: CONFIG
// A proposta vem pronta no link (?d=...), montada no painel do diagnóstico.
// ═══════════════════════════════════════════════════════════════
const WHATSAPP = "5551982276577";
const CANAIS = { meta:"Instagram + Facebook", google:"Google (busca)", youtube:"YouTube" };
const app = document.getElementById("app");
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => (Math.round(v)||0).toLocaleString("pt-BR", { style:"currency", currency:"BRL", maximumFractionDigits:0 });

function ler(){
  try{
    const b = new URLSearchParams(location.search).get("d").replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(decodeURIComponent(escape(atob(b))));
  }catch(e){ return null; }
}

// ═══════════════════════════════════════════════════════════════
// BLOCO 4: TELA
// ═══════════════════════════════════════════════════════════════
const d = ler();
if(!d || !Array.isArray(d.o)){
  app.innerHTML = `<div class="vazio"><h1>Proposta não encontrada.</h1><p>Me chama no WhatsApp que eu te mando o link certo.</p>
    <p style="margin-top:1rem"><a class="btn" href="https://wa.me/${WHATSAPP}">Falar No WhatsApp</a></p></div>`;
} else {
  const nome = esc(d.n), neg = esc(d.e);
  app.innerHTML = `<section class="heroi"><div class="in">
      <p class="eyebrow">Proposta sob medida</p>
      <h1>${nome ? nome + ", aqui" : "Aqui"} estão as opções ${neg ? `pro <em>${neg}</em>` : "<em>pra você</em>"}.</h1>
      <p>Montei a partir do que você me contou. Escolha a que cabe melhor no seu momento: dá pra começar menor e crescer depois.</p>
      <div style="height:56px"></div>
    </div></section>
    <main class="wrap">
      <div class="opcoes">${d.o.map(o => {
        const msg = `Oi, Élton! Vi a proposta e quero a opção ${o.t}: ${o.s} semana${o.s>1?"s":""} (${o.c.map(k=>CANAIS[k]).join(", ")}).`;
        const vendas = Math.round(o.cl * 0.3);
        return `<article class="op ${o.r?"rec":""}">${o.r ? `<span class="selo">Recomendada</span>` : ""}
          <h2>${esc(o.t)}</h2><p class="dur">${o.s} semana${o.s>1?"s":""} de campanha</p>
          <ul class="canais">${o.c.map(k => `<li>Anúncio no ${esc(CANAIS[k]||k)}</li>`).join("")}
            <li>Conteúdo isca com funil de vendas integrado</li><li>Automação de atendimento no WhatsApp</li></ul>
          <div class="linha"><span>Nosso serviço</span><b>${brl(o.sv)}</b></div>
          <div class="linha"><span>Anúncio<small>pago direto na plataforma, no seu cartão</small></span><b>${brl(o.v)}</b></div>
          <div class="linha tot"><span>Total</span><b>${brl(o.sv + o.v)}</b></div>
          <div class="est">Estimativa: <b>~${o.cl} clientes prontos pra comprar</b> chegando no seu WhatsApp${d.t ? `. Se 3 em cada 10 comprarem, são <b>~${vendas} vendas (${brl(vendas * d.t)})</b>` : ""}.</div>
          <a class="btn" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Quero Essa Opção</a>
        </article>`;
      }).join("")}</div>
      <div class="notas">
        <div class="nota"><h3>O anúncio é seu</h3>O dinheiro do anúncio não passa pela gente: você cadastra o seu cartão direto no Instagram e no Google. No Instagram e no Facebook o valor já inclui os impostos que a Meta cobra na fatura.</div>
        <div class="nota"><h3>Estimativa, não promessa</h3>O número de clientes é uma estimativa feita com base na verba. A gente acompanha todo dia e ajusta o anúncio pra trazer mais gente pronta pra comprar.</div>
        <div class="nota"><h3>Ficou com dúvida?</h3>Me chama no WhatsApp que a gente ajusta a opção pro seu momento.</div>
      </div>
    </main>`;
}
</script>
</body>
</html>
